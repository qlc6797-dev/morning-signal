name: Verify mobile news fix

on:
  push:
    branches:
      - agent/fix-mobile-news-feed
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/briefing-domain.test.mjs tests/rendered-html.test.mjs tests/semiconductor-news.test.mjs
      - run: npm run lint
